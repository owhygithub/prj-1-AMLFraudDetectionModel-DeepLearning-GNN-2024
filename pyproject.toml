[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amlgnn"
version = "1.0.0"
description = "Graph neural network for anti-money-laundering detection on IBM synthetic transaction data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Oskar Wang" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
tuning = ["optuna>=3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
